:root{--coral:#ef493d;--blush:#fececa;--ink:#161c24;--slate:#454f5b;--cloud:#c4cdd5;--chalk:#dfe3e8;--white:#fff;--grid:rgba(255,255,255,.06)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:"Noto Sans",sans-serif}
#stage{position:relative;width:1280px;height:720px;overflow:hidden}
.thumb{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.half{position:absolute;top:0;width:50%;height:100%;object-fit:cover}.half.l{left:0}.half.r{left:50%}
.seam{position:absolute;left:calc(50% - 4px);top:0;width:8px;height:100%;background:var(--white)}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,28,36,0) 40%,rgba(22,28,36,.55) 100%)}
.pxcard{position:absolute;--bg:var(--white);--border:var(--chalk);--ink2:var(--ink);--sub:var(--slate);filter:drop-shadow(8px 8px 0 var(--blush))}
.pxcard.night{--bg:var(--ink);--border:rgba(255,255,255,.16);--ink2:var(--white);--sub:var(--cloud);filter:drop-shadow(8px 8px 0 rgba(0,0,0,.35))}
.pxcard .face{position:absolute;inset:0;clip-path:polygon(0 20px,10px 20px,10px 10px,20px 10px,20px 0,calc(100% - 20px) 0,calc(100% - 20px) 10px,calc(100% - 10px) 10px,calc(100% - 10px) 20px,100% 20px,100% calc(100% - 20px),calc(100% - 10px) calc(100% - 20px),calc(100% - 10px) calc(100% - 10px),calc(100% - 20px) calc(100% - 10px),calc(100% - 20px) 100%,20px 100%,20px calc(100% - 10px),10px calc(100% - 10px),10px calc(100% - 20px),0 calc(100% - 20px));background:linear-gradient(var(--bg),var(--bg)) 2px 2px/calc(100% - 4px) calc(100% - 4px) no-repeat,var(--border)}
.pxcard.night .face{background:linear-gradient(var(--grid) 2px,transparent 2px) 2px 2px/48px 48px,linear-gradient(90deg,var(--grid) 2px,transparent 2px) 2px 2px/48px 48px,linear-gradient(var(--bg),var(--bg)) 2px 2px/calc(100% - 4px) calc(100% - 4px) no-repeat,var(--border)}
.body{position:relative;z-index:1;padding:36px 40px;display:flex;flex-direction:column;gap:14px;color:var(--ink2)}
.wordmark{display:block}
.eyebrow{font:400 22px/1 "Tiny5",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.title{font:800 58px/1.05 "Onest",sans-serif;letter-spacing:-.03em}.title.big{font-size:72px}
.sub{font:600 26px/1.3 "Noto Sans",sans-serif;color:var(--sub)}
.num{font:800 190px/.95 "Onest",sans-serif;letter-spacing:-.05em;color:var(--coral)}
</style></head>

<div id="stage" data-composition-id="thumbs" data-start="0" data-duration="3" data-fps="30" data-width="1280" data-height="720">

      <div class="thumb clip" id="thumb-a" data-start="0" data-duration="1" data-track-index="1">
    <img class="bg" src="frames/face.jpg" style="object-position:60% 35%" />
    <div class="scrim"></div>
    <div class="pxcard night" style="left:48px;bottom:48px;max-width:760px">
      <div class="face"></div>
      <div class="body">
        <img class="wordmark" src="brand/nowa-wordmark-pastel.svg" style="width:150px" alt="Nowa" />
        <div class="eyebrow">AUGUST UPDATE</div>
        <div class="title">The first 50 are built</div>
        <div class="sub">EVT done in Shenzhen · October launch</div>
      </div>
    </div>
      </div>

      <div class="thumb clip" id="thumb-b" data-start="1" data-duration="1" data-track-index="1">
    <img class="bg" src="frames/trays.jpg" style="object-position:50% 50%" />
    <div class="pxcard day" style="left:48px;top:48px;max-width:700px">
      <div class="face"></div>
      <div class="body">
        <img class="wordmark" src="brand/nowa-wordmark.svg" style="width:150px" alt="Nowa" />
        <div class="num">50</div>
        <div class="title">units. Tested. Passed.</div>
      </div>
    </div>
      </div>

      <div class="thumb clip" id="thumb-c" data-start="2" data-duration="1" data-track-index="1">
    <img class="half l" src="frames/face.jpg" style="object-position:62% 35%" />
    <img class="half r" src="frames/macro.jpg" style="object-position:50% 50%" />
    <div class="seam"></div>

      </div>
    </div>
      </div>
